[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hookline"
version = "0.1.0"
description = "A webhook delivery service with signed payloads, retries and delivery history."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "aref" }]
dependencies = [
    "fastapi>=0.143.0,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.15.0,<3",
    "sqlalchemy>=2.1.4,<3",
    "psycopg[binary]>=3.3.6,<4",
    "alembic>=1.20.0,<2",
    "bcrypt>=5.0.0,<6",
    "pyjwt>=2.15.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "httpx2>=2.13.1,<3",
    "ruff>=0.17.0,<1",
    "mypy>=2.4.0,<3",
    "testcontainers[postgres]>=4.15.0,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: tests that need a real PostgreSQL database"]

[tool.coverage.run]
source = ["hookline"]
branch = true
