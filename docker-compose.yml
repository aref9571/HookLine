x-hookline: &hookline
  build: .
  image: hookline:local
  env_file: .env
  environment:
    HOOKLINE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *hookline
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *hookline
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *hookline
    command: ["python", "-m", "hookline.worker"]
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  receiver:
    image: python:3.12-slim
    command: ["python", "-u", "/app/demo_receiver.py"]
    init: true
    environment:
      RECEIVER_SECRET: ${RECEIVER_SECRET:-}
    volumes:
      - ./scripts/demo_receiver.py:/app/demo_receiver.py:ro

volumes:
  postgres-data:
